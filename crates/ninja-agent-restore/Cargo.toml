[package]
name = "ninja-agent-restore"
description = "记录各窗正在跑的 CLI agent（pi / Codex / Claude），Ninja 重启后按 session 恢复"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 红线：独立进程，只依赖 ninja-protocol + 系统接口。不链宿主、不链 ghostty。
[[bin]]
name = "ninja-agent-restore"
path = "src/main.rs"

[dependencies]
ninja-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
