[package]
name = "ninja-preview"
description = "官方示例插件：单文件编辑器，独立进程（ADE 协议 v0）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 红线：独立进程，只准依赖 ninja-protocol。永不依赖宿主 crate `ninja`
# （验收：`cargo tree -p ninja-preview` 无宿主 crate）、不链 ghostty-sys。
[[bin]]
name = "ninja-preview"
path = "src/main.rs"

[dependencies]
ninja-protocol.workspace = true
