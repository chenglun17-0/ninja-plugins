[workspace]
resolver = "2"
members = [
    "crates/ninja-protocol",
    "crates/ninja-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ninja-protocol = { path = "crates/ninja-protocol" }
